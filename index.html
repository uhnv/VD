<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Updated to romantic deep reds and soft pinks */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(190, 20, 70, 0.2);
            text-align: center;
            z-index: 10;
            transform: scale(0.9);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 2px solid #ff4d6d;
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        h1 {
            color: #c9184a;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #590d22;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        .btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .btn:hover {
            background: #ff758f;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6);
        }

        /* Floating Hearts Styles */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { 
                transform: translateY(0) rotate(0deg); 
                opacity: 0; 
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-120vh) rotate(45deg); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>❤️ Happy Valentine's! 🌹</h1>
        <p>Sending you all my love today.<br>You make my heart skip a beat!</p>
        <button class="btn" onclick="celebrate()">Send Love!</button>
    </div>

    <script>
        // Valentine themed emojis
        const loveEmojis = ['❤️', '💖', '💘', '🌹', '✨', '💕', '💌', '🧸'];

        function celebrate() {
            // Heart-colored confetti
            confetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd']
            });
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = loveEmojis[Math.floor(Math.random() * loveEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // Create a steady stream of hearts
        setInterval(createHeart, 400);
        
        // Initial "love blast"
        setTimeout(celebrate, 500);
    </script>
</body>
</html>
